[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-dayolo"
version = "1.0.0"
description = "MS-DAYOLO: Multiscale Domain Adaptive YOLO for Cross-Domain Object Detection (PyTorch Implementation)"
readme = "README_PYTORCH.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mazin Hnewa", email = "hnewa@msu.edu"},
    {name = "PyTorch Migration Team"}
]
maintainers = [
    {name = "PyTorch Migration Team"}
]
keywords = [
    "computer-vision",
    "object-detection",
    "domain-adaptation",
    "yolo",
    "yolov8",
    "deep-learning",
    "pytorch",
    "transfer-learning",
    "unsupervised-domain-adaptation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.7.0",
    "Pillow>=9.5.0",
    "albumentations>=1.3.0",
    "tensorboard>=2.12.0",
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
    "pycocotools>=2.0.6",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "mypy>=1.3.0",
]

docs = [
    "sphinx>=6.2.0",
    "sphinx-rtd-theme>=1.2.0",
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.1.0",
]

jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.23.0",
    "ipywidgets>=8.0.0",
]

export = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxsim>=0.4.0",
]

distributed = [
    "accelerate>=0.20.0",
]

all = [
    "ms-dayolo[dev,docs,jupyter,export,distributed]",
]

[project.urls]
Homepage = "https://github.com/mazin-hnewa/MS-DAYOLO"
Documentation = "https://github.com/mazin-hnewa/MS-DAYOLO/blob/pytorch-migration/README_PYTORCH.md"
Repository = "https://github.com/mazin-hnewa/MS-DAYOLO"
"Bug Tracker" = "https://github.com/mazin-hnewa/MS-DAYOLO/issues"
"Original Paper" = "https://ieeexplore.ieee.org/document/9506039"

[project.scripts]
ms-dayolo-train = "ms_dayolo.engine.train:main"
ms-dayolo-val = "ms_dayolo.engine.val:main"
ms-dayolo-detect = "ms_dayolo.engine.detect:main"
ms-dayolo-export = "ms_dayolo.engine.export:main"

[tool.setuptools]
packages = ["ms_dayolo", "ms_dayolo.models", "ms_dayolo.data", "ms_dayolo.losses", "ms_dayolo.training", "ms_dayolo.utils", "ms_dayolo.engine"]

[tool.setuptools.package-data]
ms_dayolo = ["*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | src
  | cfg
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = ["src", "cfg", "data", "3rdparty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=ms_dayolo --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["src", "cfg", "data", "3rdparty", "build", "dist"]

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["ms_dayolo"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
